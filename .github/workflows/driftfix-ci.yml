name: DriftFix CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  driftfix-test:
    name: driftfix-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regression tests
        run: pnpm test

      - name: Type check
        run: pnpm typecheck
